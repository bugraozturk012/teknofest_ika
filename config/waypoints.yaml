# waypoints.yaml — LYDİA Parkur Waypoint Tanımları
# =====================================================
#
# Her aşama için bir waypoint tanımlıdır.
# x, y : SLAM haritasında metrik koordinat [m]
# yaw  : Hedefe varışta aracın yönü [radyan]
#        0.0  = Doğu (+x yönü)
#        1.57 = Kuzey (+y yönü)
#       -1.57 = Güney (-y yönü)
#        3.14 = Batı (-x yönü)
#
# ⚠️  PLACEHOLDER DEĞERLERİ — Gerçek parkur haritasından güncelle!
#     Harita kaydedildikten sonra rviz2 ile koordinatları oku:
#     ros2 run rviz2 rviz2 → 2D Nav Goal ile konumları not al
#
# yolo_sinifi : Görüntü işleme ekibinin YOLO'dan yayınlayacağı sınıf adı
#               Bu değer /yolo/trigger topic'inden gelecek
#
# pas_gecilir : true → bu aşama timeout'ta otomatik atlanır
#               false → aşama zorunlu, timeout'ta dur

asamalar:

  - isim: SU_GECISI
    yolo_sinifi: su_gecisi
    waypoint:
      x: 3.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: "Su geçidi aşaması — yavaş geç, eğim kontrolü aktif"

  - isim: TASLI_YOL
    yolo_sinifi: tasli_yol
    waypoint:
      x: 7.0
      y: 1.5
      yaw: 0.3
    pas_gecilir: false
    aciklama: "Taşlı yol — hız sınırı aktif, titreşim tolere edilir"

  - isim: YAN_EGIM
    yolo_sinifi: yan_egim
    waypoint:
      x: 11.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: "Yan eğim — roll açısı izlenir, hız kısılır"

  - isim: DIK_ENGEL
    yolo_sinifi: dik_engel
    waypoint:
      x: 15.0
      y: -1.0
      yaw: -0.2
    pas_gecilir: true
    aciklama: "Dik engel — Nav2 engel kaçınması devreye girer"

  - isim: TRAFIK_KON
    yolo_sinifi: trafik_koni
    waypoint:
      x: 20.0
      y: 2.0
      yaw: 0.5
    pas_gecilir: false
    aciklama: "Trafik konisi slalom — dar geçiş, hız düşürülür"

  - isim: KAYAR_ENGEL
    yolo_sinifi: kayar_engel
    waypoint:
      x: 25.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: true
    aciklama: "Kayar engel — engel pozisyonu değişkendir, dinamik planlama"

  - isim: DIK_EGIM
    yolo_sinifi: dik_egim
    waypoint:
      x: 30.0
      y: -2.0
      yaw: -0.3
    pas_gecilir: false
    aciklama: "Dik eğim — tork artışı, anti-rollback aktif"

  - isim: ATIS
    yolo_sinifi: atis
    waypoint:
      x: 35.0
      y: 1.0
      yaw: 0.2
    pas_gecilir: false
    aciklama: "Atış pozisyonu — araç durur, lazer/top mekanizması tetiklenir"

  - isim: HIZLANMA
    yolo_sinifi: hizlanma
    waypoint:
      x: 45.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: "Hızlanma bölgesi — maksimum hız, düz zemin"

# Genel parametreler
parametreler:
  yolo_confidence_esigi: 0.75     # Bu değerin altındaki tespitler görmezden gelinir
  ardisik_frame_sayisi: 3         # Kaç ardışık frame'de tespit edilmeli
  hedef_tolerans_metre: 0.30      # Hedefe bu kadar yaklaşınca "ulaşıldı" sayılır
  hedef_tolerans_yaw: 0.20        # Yaw toleransı [radyan] ≈ 11.5°
  asama_timeout_saniye: 120.0     # Aşama bu sürede tamamlanamazsa sonraki aşamaya geç
  baslangic_bekleme: 3.0          # Otonom moda geçişte bekleme süresi [s]
