# parkur_cad — 20260604_Parkur STEP montajından çıkarılan ölçüler.
#
#   ⚠️  BU KOORDİNATLAR CAD ÇERÇEVESİNDE. Nav2'nin `map` çerçevesi değil,
#       SAHADA DOĞRULANMADI. `waypoint:` alanları bilerek 0.0 bırakıldı ki
#       misyon_fsm.load_waypoints'in "hepsi (0,0)" uyarısı susmasın.
#
#   Kullanmak için tek bir katı dönüşüm gerekir: SLAM haritası alındıktan sonra
#   parkurun bilinen bir noktası rviz'den okunur, aşağıdaki dx/dy/dyaw doldurulur
#   ve waypoint_cad → waypoint dönüşümü uygulanır:
#       x_map = dx + cos(dyaw)*x_cad - sin(dyaw)*y_cad
#       y_map = dy + sin(dyaw)*x_cad + cos(dyaw)*y_cad
#       yaw_map = dyaw + yaw_cad
#   Göreli geometri kesin olduğu için yarışma günü 11 nokta değil BİR dönüşüm
#   ölçülür.
#
#   Eksen: x = X_cad, y = -Z_cad (CAD'de Y düşey ve yukarı pozitif). Birim m.
#   Waypoint = tabelanın 3 m'lik şeridin ortasına dik izdüşümü; yol yönü aynı
#   duvardaki komşu bariyerden (bariyerin yerel eksenleri uzunlukla hizalı DEĞİL).
#   Doğrulama: 11/11 waypoint kendi engelinin ayak izinin içinde ya da girişinde,
#   hepsi duvardan >= robot_radius uzakta.
parkur_cad:
  kaynak: "20260604_PRK26-A-001-001-00.STEP"
  dogrulandi_saha: false
  donusum:
    dx: null
    dy: null
    dyaw: null

# waypoints.yaml — LYDİA Gerçek Parkur Waypoint Tanımları
# =========================================================
#
# ⚠️  TÜM KOORDİNATLAR PLACEHOLDER (0.0) — SLAM haritasından güncelle!
#     Harita alındıktan sonra rviz2 ile 2D Nav Goal ile konumları ölç:
#     ros2 launch teknofest_ika gercek_harita.launch.py
#     rviz2 → 2D Nav Goal ile her aşamanın hedefini belirle ve buraya yaz.
#
# yolo_sinifi : Aşamanın parkurda hangi tabelayla işaretlendiği. YALNIZ BELGE —
#               bu alanı okuyan kod YOKTUR. Tabela sınıfı çalışma anında
#               kameradan geliyor: yolo_adapter_node modelin çıktısını
#               /ika/detections JSON'una ve /yolo/class_id UInt8'e çevirir,
#               terrain_adapter oradan arazi profilini (hız + inflation) seçer.
#               Buradaki değeri değiştirmek araç davranışını DEĞİŞTİRMEZ.
#
# 🔑 AŞAMAYI HANGİ DURUMA YOLLADIĞINI `isim` BELİRLER, bu dosyadaki başka
#    hiçbir alan değil. misyon_fsm.load_waypoints eşlemeyi ADDAN türetiyor:
#      ATIS_BOLGESI                      → shoot     (ShootApproach → Shoot)
#      HIZLANMA_PARKURU                  → hizlanma  (HizlanmaState, Nav2 baypas)
#      DIK_EGIM_GIRIS / DIK_EGIM_CIKIS   → rampa     (RampaState, Nav2 baypas)
#      diğerleri                          → nav       (Nav2 / kayan hedef)
#
#    ⚠️ Bir aşamanın ADINI değiştirmek davranışını SESSİZCE değiştirir: rampa
#    baypası kapanır, atış durumuna hiç girilmez, hata basılmaz. Eşleme
#    test_birim.py'de load_waypoints çalıştırılarak kilitli.
#
#    Burada bir zamanlar `type:` alanları vardı ve okunuyormuş gibi
#    duruyorlardı; hiçbiri okunmuyordu. İkinci bir kaynakmış gibi görünen o
#    alanlar, rampa baypasının ölü olduğu sonucuna vardırdı — silindiler.
#
# pas_gecilir : Şartname §9 pas hakkı. VARSAYILAN false, öyle kalmalı.
#               true → aşama timeout'a girerse FSM bir sonraki hedefe geçer.
#               false → aşama zorunlu, timeout'ta hata kurtarmaya düşer.
#
#               Pas otonom bir kaçış yolu DEĞİLDİR. Şartname §9 pas geçmeyi
#               "takım üyeleri parkura girerek araçlarını pas geçilen parkurun
#               sonuna insan gücüyle taşıyarak konumlandıracaktır" diye
#               tanımlar; süre de durmaz. Yani buradaki bayrak, sahada verilmiş
#               bir insan kararını yazılıma bildirir — timeout'un otomatik
#               sonucu olamaz.
#
#               Üç kısıt birden geçerli:
#                 · koşu başına YALNIZCA 1 aşama (misyon_fsm PAS_HAKKI)
#                 · pas geçilen aşamanın tam puanı EKSİ yazılır (pas_puan)
#                 · hızlanma parkuru ve otonom koşuda trafik konileri
#                   pas geçilemez (misyon_fsm PAS_GECILEMEZ)
#
# pas_puan    : §9 tablosunda o aşamadan alınabilecek en yüksek puan. Pas
#               hâlinde aynı sayı eksi olarak yazılır, yani KAYAR_ENGEL pası
#               kaçırılan +50 ile birlikte 100 puanlık salınım demektir.
#
# Tabela → class_id eşlemesi (ALFABETİK model sırası — topics.py ile aynı):
#   Tabela_1     (class_id= 0) → SULU_YOL
#   Tabela_10    (class_id= 1) → DIK_EGIM_CIKIS
#   Tabela_11    (class_id= 2) → HIZLANMA başlangıcı
#   Tabela_11_son(class_id= 3) → HIZLANMA sonu
#   Tabela_2     (class_id= 4) → TASLI_YOL
#   Tabela_3     (class_id= 5) → YAN_EGIM
#   Tabela_4     (class_id= 6) → DIK_ENGEL
#   Tabela_5     (class_id= 7) → KONİLİ_YOL
#   Tabela_6     (class_id= 8) → KAYAR_ENGEL
#   Tabela_7     (class_id= 9) → ENGEBELİ_ARAZİ
#   Tabela_8     (class_id=10) → DIK_EGIM
#   Tabela_9     (class_id=11) → ATIS_BOLGESI
#   Tabela_stop  (class_id=12) → STOP işareti
#   hedef_tahtasi(class_id=13) → atış hedefi
#   trafik_huni  (class_id=14) → trafik konisi

asamalar:
  - isim: SULU_YOL
    yolo_sinifi: Tabela_1
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -0.120
      y: -0.000
      yaw: -3.1416
    pas_gecilir: false
    pas_puan: 10        # §9 su geçişi ve yağmur
    timeout_saniye: 50     # 10.0 m ÷ 0.20 m/s — başlangıç→1 varsayılan 10 m · su geçişi §6.4
    mesafe_m: 10.0         # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    aciklama: "Sulu yol — μ≈0.3, yavaş geç, frenleme mesafesi artar"

  - isim: TASLI_YOL
    yolo_sinifi: Tabela_2
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -7.619
      y: -0.000
      yaw: -3.1416
    pas_gecilir: false
    pas_puan: 5        # §9 çakıllı / taşlı yol
    timeout_saniye: 40     # 7.2 m ÷ 0.20 m/s — çakıllı/taşlı yol §6.3
    mesafe_m: 7.2          # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    aciklama: "Taşlı yol — lateral temas düzensiz, hız kısılır"

  - isim: YAN_EGIM
    yolo_sinifi: Tabela_3
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -12.876
      y: -0.000
      yaw: -3.1416
    pas_gecilir: false
    pas_puan: 5        # §9 yan eğim
    timeout_saniye: 25     # 5.0 m ÷ 0.20 m/s — yan eğim §6.5 · taban 25 s
    mesafe_m: 5.0          # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    aciklama: "Yan eğim %20 (§6.5, 11,31°) — roll eşikleri topics.py'de
      (uyarı 13°, dur 15°, E-STOP 20°) ama bunları uygulayan imu_guvenlik
      düğümü VARSAYILAN KAPALI (IMU_GUVENLIK_AKTIF=0): eşiği IMU'nun montaj
      yönüne güveniyor ve o yön doğrulanmadı. Açılmadan roll izlenmiyor."

  - isim: DIK_ENGEL
    yolo_sinifi: Tabela_4
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -18.047
      y: 10.000
      yaw: 0.0000
    pas_gecilir: false
    pas_puan: 5        # §9 dik engel
    timeout_saniye: 90     # 22.0 m ÷ 0.25 m/s — sol U dönüşü + 15 cm blok §6.6 — en uzun segment
    mesafe_m: 22.0         # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    viraj: sag             # sol U dönüşü: y=0 → y=10 şeridine sağa dönülür, iç duvar SAĞDA.
                           # Merkez çizgisi hedef veremeyince bu duvara düşülür.
    aciklama: "Dik engel — Nav2 lokal costmap engeli kaçınır"

  - isim: KONİLİ_YOL
    yolo_sinifi: Tabela_5
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -12.717
      y: 10.000
      yaw: 0.0000
    pas_gecilir: false
    pas_puan: 50        # §9 trafik konileri — otonom koşuda PAS GEÇİLEMEZ
    timeout_saniye: 25     # 5.0 m ÷ 0.30 m/s — düz şerit · taban 25 s
    mesafe_m: 5.0          # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    aciklama: "Konili yol slalom — dar geçiş, cone_fusion_node aktif"

  - isim: KAYAR_ENGEL
    yolo_sinifi: Tabela_6
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -2.752
      y: 10.000
      yaw: -0.0000
    pas_gecilir: false
    pas_puan: 50        # §9 kayar engel (temassız geçilirse)
    timeout_saniye: 65     # 9.8 m ÷ 0.15 m/s — 8 koni slalomu §6.7 — en yavaş segment
    mesafe_m: 9.8          # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    aciklama: "Kayar engel — pozisyon değişkendir, kayar_yon beklenir"

  - isim: ENGEBELİ_ARAZİ
    yolo_sinifi: Tabela_7
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: 0.250
      y: 19.954
      yaw: 3.1163
    pas_gecilir: false
    pas_puan: 5        # §9 engebeli arazi
    timeout_saniye: 65     # 15.7 m ÷ 0.25 m/s — sağ U dönüşü
    mesafe_m: 15.7         # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    viraj: sol             # sağ U dönüşü: y=10 → y=20 şeridine sola dönülür, iç duvar SOLDA.
                           # Merkez çizgisi hedef veremeyince bu duvara düşülür.
    aciklama: "Engebeli arazi — titreşim tolere, hız minimum"

  - isim: DIK_EGIM_GIRIS
    yolo_sinifi: Tabela_8
    waypoint:
      x: 0.0   # ⚠️ PLACEHOLDER — rampa giriş noktası (düz zemin, rampadan önce)
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -12.849
      y: 20.000
      yaw: -3.1416
    pas_gecilir: false
    pas_puan: 15        # §9 dik eğimler parkuru — giriş+çıkış TEK aşama, puan bir kez
    timeout_saniye: 65     # 13.0 m ÷ 0.20 m/s — engebeli arazi §6.9
    mesafe_m: 13.0         # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    # §6.10 duruşu eğimin ORTASINDA — rampa dibinde DEĞİL. Parkur CAD'inde
    # "Dik egim" 8,602 m uzunluğunda ve 1,850 m yüksekliğinde; %45 eğimde her
    # yamacın yatay koşusu 4,11 m, yamaç boyu 4,51 m, ortası 2,25 m. Tepe
    # platosu yalnız 0,38 m — araç 1,90 m olduğu için orada zirveyi köprüler
    # ve pitch ~0 okur (atış noktası bu yüzden düz zemin gibi davranır).
    # Sayı yamaç ortası DEĞİL 2,05: faz 'egimde'ye pitch 15°'yi geçince
    # giriliyor ve o an araç merkezi yamaçta zaten ~0,20 m ilerlemiş oluyor.
    # 0 verilirse ara duruş kapanır. Sahada kaydırılacak.
    durus_mesafe_m: 2.05
    aciklama: >
      §6.10 Dik eğim girişi. Rampa öncesi düz zemin. Rampa dibindeki STOP işareti
      NavigateState tarafından tespit edilir (Tabela_stop/class_id=13):
      araç 2s durur, 3s cooldown, rampa çıkışına devam.

  - isim: ATIS_BOLGESI
    yolo_sinifi: Tabela_9
    # ShootApproach → Shoot durumlarına ADIYLA gidiyor (bkz. dosya başı).
    # Taret kapalıyken (TARET_AKTIF=0) atış başarısız olur ama görev DÜŞMEZ:
    # ERROR_RECOVERY bir deneme harcar, sonraki istasyon tamamlanınca sayaç
    # sıfırlanır. Bedeli koşu süresinden ~30-60 s.
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -15.575
      y: 20.000
      yaw: -3.1416
    pas_gecilir: false
    pas_puan: 50        # §9 atış (iç daire); §9 pas örneği doğrudan bu aşamayı -50 diye verir
    timeout_saniye: 25     # 2.5 m ÷ 0.20 m/s — %45 rampa çıkışı §6.10 · taban 25 s
    mesafe_m: 2.5          # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    aciklama: "Atış bölgesi — araç durur, nişan alır, lazer ateşlenir (max 3 deneme)"


  - isim: DIK_EGIM_CIKIS
    yolo_sinifi: Tabela_10
    waypoint:
      x: 0.0   # ⚠️ PLACEHOLDER — rampa çıkış noktası (iniş sonrası düz zemin)
      y: 0.0
      yaw: 0.0
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -18.319
      y: 20.000
      yaw: 3.1416
    pas_gecilir: false
    pas_puan: 0        # §9 puanı DIK_EGIM_GIRIS üzerinde, iki kez sayılmaz
    timeout_saniye: 25     # 2.5 m ÷ 0.20 m/s — %45 rampa inişi §6.10 · taban 25 s
    mesafe_m: 2.5          # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    # §6.10 duruşu eğimin ORTASINDA — rampa dibinde DEĞİL. Parkur CAD'inde
    # "Dik egim" 8,602 m uzunluğunda ve 1,850 m yüksekliğinde; %45 eğimde her
    # yamacın yatay koşusu 4,11 m, yamaç boyu 4,51 m, ortası 2,25 m. Tepe
    # platosu yalnız 0,38 m — araç 1,90 m olduğu için orada zirveyi köprüler
    # ve pitch ~0 okur (atış noktası bu yüzden düz zemin gibi davranır).
    # Sayı yamaç ortası DEĞİL 2,05: faz 'egimde'ye pitch 15°'yi geçince
    # giriliyor ve o an araç merkezi yamaçta zaten ~0,20 m ilerlemiş oluyor.
    # 0 verilirse ara duruş kapanır. Sahada kaydırılacak.
    durus_mesafe_m: 2.05
    aciklama: >
      §6.10 Dik eğim çıkışı. Rampa üzerinde çıkarken ve inerken STOP işaretleri
      NavigateState tarafından ayrı ayrı işlenir. Cooldown=3s rampa geçiş süresinden
      kısa olduğu için her STOP doğru tetiklenir. anti_rollback aktif.

  - isim: HIZLANMA_PARKURU
    yolo_sinifi: Tabela_11
    # HizlanmaState'e ADIYLA gidiyor (bkz. dosya başı). Eşleme kopsaydı §6.11
    # parkuru sıradan bir Nav2 hedefi olarak arazi profilinin hızıyla
    # (0.65 m/s) sürülürdü; HizlanmaState tam gaz veren tek yol. Tarete bağlı
    # değil, /odom yoksa kendini iptal eder.
    waypoint:
      x: 0.0    # ⚠️ PLACEHOLDER — SLAM haritasından doldur (pistin başlangıç noktası)
      y: 0.0
      yaw: 0.0  # aracın ilerleme yönüne hizala
    # ⚠️ Tabela_11 iki yarış şeridini ayıran ORTA bariyer sırasında; §6.11'e göre
    # takımlar yan yana yarışıyor ve şeridi hakem heyeti atıyor. Tabelanın iki
    # yanındaki şerit ortaları y = 30.000 ve y = 33.360; hangisi bize düşerse
    # o yazılacak. Aşağıdaki değer keyfî seçilmiş DEĞİL, sadece iki adaydan biri.
    waypoint_cad:        # CAD çerçevesi — donusum uygulanmadan kullanma
      x: -25.556
      y: 33.360
      yaw: 0.0000
    pas_gecilir: false
    pas_puan: 25        # §9 hızlanma — PAS GEÇİLEMEZ
    timeout_saniye: 65     # 19.2 m ÷ 0.30 m/s — düz şerit
    mesafe_m: 19.2         # [m] kayan hedef yolunda aşamanın bitiş ölçütü — CAD'den
                           # planlayıcıyla ölçülen GERÇEK yol (kuş uçuşu değil).
    aciklama: >
      §6.11 Hızlanma parkuru girişi. Nav2 bu noktaya götürür, sonra
      HizlanmaState devralır: Nav2 bypass, doğrudan /cmd_vel 3.0 m/s,
      30m enkoder mesafesi, son 5m rampalı fren, Tabela_11_son yedek dur.

# Genel parametreler
parametreler:
  ardisik_frame_sayisi: 3         # terrain_adapter.py → kaç ardışık frame'de tabela geçerli sayılır
  hedef_tolerans_metre: 0.30      # nav2_params.yaml xy_goal_tolerance ile eşleştirildi [m]
  hedef_tolerans_yaw: 0.20        # nav2_params.yaml yaw_goal_tolerance ile eşleştirildi [rad]
  asama_timeout_saniye: 120.0     # YEDEK tavan — yalnız timeout_saniye'si olmayan aşama için [s]
  baslangic_bekleme: 3.0          # Otonom moda geçişte bekleme süresi [s]

  # Hedefleme yolu — koşu başında BİR KEZ seçilir, gerekçesiyle loglanır.
  #   harita : waypoint koordinatları Nav2'ye `map` çerçevesinde verilir.
  #            Anlamlı olması için `parkur_cad.donusum` ölçülmüş ve
  #            `waypoint:` alanları doldurulmuş olmalı.
  #   kayan  : hedef her döngüde LiDAR taramasından üretilir; waypoint
  #            koordinatına da SLAM haritasının doğruluğuna da ihtiyaç yok.
  #            Aşama, `mesafe_m` kadar YOL kat edilince biter.
  #   oto    : waypoint'ler doluysa harita, hepsi (0,0) ise kayan.
  # Varsayılan `oto`, çünkü açıkça istenen `harita`'ya waypoint'ler boş olsa
  # bile uyulur: araç map orijinine gider, sonraki aşamalar anında "ulaşıldı"
  # sayılır ve koşu parkuru hiç sürmeden biter — tek bir hata satırı bile
  # görünmeden. `oto` o tuzağı kapatır ve dönüşüm ölçülüp `waypoint:` alanları
  # doldurulduğu anda kendiliğinden haritaya geçer.
  # `ros2 run ... --ros-args -p hedefleme_modu:=kayan` ile ezilir
  # (lydia_startup.sh HEDEFLEME_MODU değişkeni).
  hedefleme_modu: oto
  kosu_suresi_saniye: 900.0       # §6.12 — atış dahil tüm koşu 15 dakika [s]
  # §6.10 rampa — RampaState Nav2'yi baypas edip doğrudan /cmd_vel basar.
  # ⚠️ İKİSİ DE ÖLÇÜLMEDİ. Tırmanış: patinaj yapmayacak kadar yüksek, tepede
  # havalanmayacak kadar düşük olmalı. İniş: yerçekimi hızlandırdığı için
  # tırmanıştan düşük. Rampada denenip buradan ayarlanır — dosya install
  # alanına symlink olduğu için derleme gerekmez, düğümü yeniden başlatmak yeter.
  rampa_tirmanis_hiz: 0.60        # [m/s] — %45 eğimde tırmanış
  rampa_inis_hiz: 0.40            # [m/s] — %45 eğimde iniş
  # Her aşamanın kendi `timeout_saniye`'si var; buradaki 120 s yalnız o alan
  # yoksa devreye girer. Tek bir ortak sayı 2,5 m'lik rampa inişine de 22 m'lik
  # sol U dönüşüne de aynı süreyi veriyordu.
  #
  # Süreler UYDURULMADI: istasyonlar arası mesafe parkur CAD'inden, aracın
  # 1,83 × 1,17 m dikdörtgeni eğriliği sınırlı ve geri vitessiz yollar boyunca
  # süpürülerek ölçüldü (scripts/parkur_cad/donus.py ile aynı planlayıcı),
  # sonra zemine göre bir ortalama hıza bölündü. Türetim her aşamanın yanında.
  # Toplam 540 s; §6.12'nin 900 s'sine 360 s pay kalıyor.
  #
  # ⚠️ Ortalama hızlar ÖLÇÜM DEĞİL, mühendislik seçimi — Nav2 bu araçta hiç
  # koşmadı (enkoder takılı değil, odometri yok). Nav2 nominali 0,65 m/s
  # (nav2_params.yaml); buradaki 0,15–0,30 kalkış/duruş, zemin ve yeniden
  # planlama payını içeriyor. İlk gerçek koşudan sonra ölçümle değiştirilmeli.
  #
  # Atış, hızlanma ve zorunlu beklemeler bu bütçelerin DIŞINDA: ayrı smach
  # durumlarında kendi timeout'larıyla geçiyor (SHOOT_APPROACH 15 s, SHOOT
  # 3×8 s, HizlanmaState 52,6+10 s), rampa duruşu ise deadline'ı uzatıyor
  # (`wp_deadline += RAMP_STOP_DURATION`). Koşu saatinden yiyorlar ama aşama
  # bütçesinden değil — en kötü hâl toplamı ≈ 659 s.
