# waypoints.yaml — LYDİA Gerçek Parkur Waypoint Tanımları
# =========================================================
#
# ⚠️  TÜM KOORDİNATLAR PLACEHOLDER (0.0) — SLAM haritasından güncelle!
#     Harita alındıktan sonra rviz2 ile 2D Nav Goal ile konumları ölç:
#     ros2 launch teknofest_ika gercek_harita.launch.py
#     rviz2 → 2D Nav Goal ile her aşamanın hedefini belirle ve buraya yaz.
#
# yolo_sinifi : YOLO modelinin tespit ettiği tabela sınıfı (Tabela_X)
#               yolo_adapter_node bu değeri /ika/detections JSON'una ve
#               /yolo/class_id UInt8'e çevirir.
#
# pas_gecilir : true → aşama timeout'ta otomatik atlanır
#               false → aşama zorunlu, timeout'ta hata kurtarmaya düşer
#
# Tabela → class_id eşlemesi (yolo_adapter_node.py ile aynı):
#   Tabela_1 (class_id=0)  → SULU_YOL
#   Tabela_2 (class_id=1)  → TASLI_YOL
#   Tabela_3 (class_id=2)  → YAN_EGIM
#   Tabela_4 (class_id=3)  → DIK_ENGEL
#   Tabela_5 (class_id=4)  → KONİLİ_YOL
#   Tabela_6 (class_id=5)  → KAYAR_ENGEL
#   Tabela_7 (class_id=6)  → ENGEBELİ_ARAZİ
#   Tabela_8 (class_id=7)  → DIK_EGIM
#   Tabela_9 (class_id=8)  → ATIS_BOLGESI
#   Tabela_10 (class_id=9) → YAN_EGIM_2

asamalar:

  - isim: SULU_YOL
    yolo_sinifi: Tabela_1
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: "Sulu yol — μ≈0.3, yavaş geç, frenleme mesafesi artar"

  - isim: TASLI_YOL
    yolo_sinifi: Tabela_2
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: "Taşlı yol — lateral temas düzensiz, hız kısılır"

  - isim: YAN_EGIM
    yolo_sinifi: Tabela_3
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: "Yan eğim — roll açısı izlenir, imu_guvenlik devrede"

  - isim: DIK_ENGEL
    yolo_sinifi: Tabela_4
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: true
    aciklama: "Dik engel — Nav2 lokal costmap engeli kaçınır"

  - isim: KONİLİ_YOL
    yolo_sinifi: Tabela_5
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: "Konili yol slalom — dar geçiş, koni_costmap aktif"

  - isim: KAYAR_ENGEL
    yolo_sinifi: Tabela_6
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: true
    aciklama: "Kayar engel — pozisyon değişkendir, kayar_yon beklenir"

  - isim: ENGEBELİ_ARAZİ
    yolo_sinifi: Tabela_7
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: true
    aciklama: "Engebeli arazi — titreşim tolere, hız minimum"

  - isim: DIK_EGIM_GIRIS
    yolo_sinifi: Tabela_8
    waypoint:
      x: 0.0   # ⚠️ PLACEHOLDER — rampa giriş noktası (düz zemin, rampadan önce)
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: >
      §6.10 Dik eğim girişi. Rampa öncesi düz zemin. Rampa dibindeki STOP işareti
      NavigateState tarafından tespit edilir (Tabela_stop/class_id=13):
      araç 2s durur, 3s cooldown, rampa çıkışına devam.

  - isim: DIK_EGIM_CIKIS
    yolo_sinifi: Tabela_8
    waypoint:
      x: 0.0   # ⚠️ PLACEHOLDER — rampa çıkış noktası (iniş sonrası düz zemin)
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: >
      §6.10 Dik eğim çıkışı. Rampa üzerinde çıkarken ve inerken STOP işaretleri
      NavigateState tarafından ayrı ayrı işlenir. Cooldown=3s rampa geçiş süresinden
      kısa olduğu için her STOP doğru tetiklenir. anti_rollback aktif.

  - isim: ATIS_BOLGESI
    yolo_sinifi: Tabela_9
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    aciklama: "Atış bölgesi — araç durur, nişan alır, lazer ateşlenir (max 3 deneme)"


  - isim: HIZLANMA_PARKURU
    yolo_sinifi: Tabela_11
    waypoint:
      x: 0.0    # ⚠️ PLACEHOLDER — SLAM haritasından doldur (pistin başlangıç noktası)
      y: 0.0
      yaw: 0.0  # aracın ilerleme yönüne hizala
    pas_gecilir: false
    aciklama: >
      §6.11 Hızlanma parkuru girişi. Nav2 bu noktaya götürür, sonra
      HizlanmaState devralır: Nav2 bypass, doğrudan /cmd_vel 10 m/s,
      30m enkoder mesafesi, son 5m rampalı fren, Tabela_11_son yedek dur.

# Genel parametreler
parametreler:
  ardisik_frame_sayisi: 3         # terrain_adapter.py → kaç ardışık frame'de tabela geçerli sayılır
  hedef_tolerans_metre: 0.30      # nav2_params.yaml xy_goal_tolerance ile eşleştirildi [m]
  hedef_tolerans_yaw: 0.20        # nav2_params.yaml yaw_goal_tolerance ile eşleştirildi [rad]
  asama_timeout_saniye: 120.0     # misyon_fsm.py → Nav2 bu sürede hedefe varamazsa goal iptal [s]
  baslangic_bekleme: 3.0          # Otonom moda geçişte bekleme süresi [s]
