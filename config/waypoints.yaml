# waypoints.yaml — LYDİA Gerçek Parkur Waypoint Tanımları
# =========================================================
#
# ⚠️  TÜM KOORDİNATLAR PLACEHOLDER (0.0) — SLAM haritasından güncelle!
#     Harita alındıktan sonra rviz2 ile 2D Nav Goal ile konumları ölç:
#     ros2 launch teknofest_ika gercek_harita.launch.py
#     rviz2 → 2D Nav Goal ile her aşamanın hedefini belirle ve buraya yaz.
#
# yolo_sinifi : YOLO modelinin tespit ettiği tabela sınıfı (Tabela_X)
#               yolo_adapter_node bu değeri /ika/detections JSON'una ve
#               /yolo/class_id UInt8'e çevirir.
#
# pas_gecilir : Şartname §9 pas hakkı. VARSAYILAN false, öyle kalmalı.
#               true → aşama timeout'a girerse FSM bir sonraki hedefe geçer.
#               false → aşama zorunlu, timeout'ta hata kurtarmaya düşer.
#
#               Pas otonom bir kaçış yolu DEĞİLDİR. Şartname §9 pas geçmeyi
#               "takım üyeleri parkura girerek araçlarını pas geçilen parkurun
#               sonuna insan gücüyle taşıyarak konumlandıracaktır" diye
#               tanımlar; süre de durmaz. Yani buradaki bayrak, sahada verilmiş
#               bir insan kararını yazılıma bildirir — timeout'un otomatik
#               sonucu olamaz.
#
#               Üç kısıt birden geçerli:
#                 · koşu başına YALNIZCA 1 aşama (misyon_fsm PAS_HAKKI)
#                 · pas geçilen aşamanın tam puanı EKSİ yazılır (pas_puan)
#                 · hızlanma parkuru ve otonom koşuda trafik konileri
#                   pas geçilemez (misyon_fsm PAS_GECILEMEZ)
#
# pas_puan    : §9 tablosunda o aşamadan alınabilecek en yüksek puan. Pas
#               hâlinde aynı sayı eksi olarak yazılır, yani KAYAR_ENGEL pası
#               kaçırılan +50 ile birlikte 100 puanlık salınım demektir.
#
# Tabela → class_id eşlemesi (ALFABETİK model sırası — topics.py ile aynı):
#   Tabela_1     (class_id= 0) → SULU_YOL
#   Tabela_10    (class_id= 1) → DIK_EGIM_CIKIS
#   Tabela_11    (class_id= 2) → HIZLANMA başlangıcı
#   Tabela_11_son(class_id= 3) → HIZLANMA sonu
#   Tabela_2     (class_id= 4) → TASLI_YOL
#   Tabela_3     (class_id= 5) → YAN_EGIM
#   Tabela_4     (class_id= 6) → DIK_ENGEL
#   Tabela_5     (class_id= 7) → KONİLİ_YOL
#   Tabela_6     (class_id= 8) → KAYAR_ENGEL
#   Tabela_7     (class_id= 9) → ENGEBELİ_ARAZİ
#   Tabela_8     (class_id=10) → DIK_EGIM
#   Tabela_9     (class_id=11) → ATIS_BOLGESI
#   Tabela_stop  (class_id=12) → STOP işareti
#   hedef_tahtasi(class_id=13) → atış hedefi
#   trafik_huni  (class_id=14) → trafik konisi

asamalar:

  - isim: SULU_YOL
    yolo_sinifi: Tabela_1
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 10        # §9 su geçişi ve yağmur
    aciklama: "Sulu yol — μ≈0.3, yavaş geç, frenleme mesafesi artar"

  - isim: TASLI_YOL
    yolo_sinifi: Tabela_2
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 5        # §9 çakıllı / taşlı yol
    aciklama: "Taşlı yol — lateral temas düzensiz, hız kısılır"

  - isim: YAN_EGIM
    yolo_sinifi: Tabela_3
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 5        # §9 yan eğim
    aciklama: "Yan eğim — roll açısı izlenir, imu_guvenlik devrede"

  - isim: DIK_ENGEL
    yolo_sinifi: Tabela_4
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 5        # §9 dik engel
    aciklama: "Dik engel — Nav2 lokal costmap engeli kaçınır"

  - isim: KONİLİ_YOL
    yolo_sinifi: Tabela_5
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 50        # §9 trafik konileri — otonom koşuda PAS GEÇİLEMEZ
    aciklama: "Konili yol slalom — dar geçiş, cone_fusion_node aktif"

  - isim: KAYAR_ENGEL
    yolo_sinifi: Tabela_6
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 50        # §9 kayar engel (temassız geçilirse)
    aciklama: "Kayar engel — pozisyon değişkendir, kayar_yon beklenir"

  - isim: ENGEBELİ_ARAZİ
    yolo_sinifi: Tabela_7
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 5        # §9 engebeli arazi
    aciklama: "Engebeli arazi — titreşim tolere, hız minimum"

  - isim: DIK_EGIM_GIRIS
    yolo_sinifi: Tabela_8
    waypoint:
      x: 0.0   # ⚠️ PLACEHOLDER — rampa giriş noktası (düz zemin, rampadan önce)
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 15        # §9 dik eğimler parkuru — giriş+çıkış TEK aşama, puan bir kez
    aciklama: >
      §6.10 Dik eğim girişi. Rampa öncesi düz zemin. Rampa dibindeki STOP işareti
      NavigateState tarafından tespit edilir (Tabela_stop/class_id=13):
      araç 2s durur, 3s cooldown, rampa çıkışına devam.

  - isim: DIK_EGIM_CIKIS
    yolo_sinifi: Tabela_10
    waypoint:
      x: 0.0   # ⚠️ PLACEHOLDER — rampa çıkış noktası (iniş sonrası düz zemin)
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 0        # §9 puanı DIK_EGIM_GIRIS üzerinde, iki kez sayılmaz
    aciklama: >
      §6.10 Dik eğim çıkışı. Rampa üzerinde çıkarken ve inerken STOP işaretleri
      NavigateState tarafından ayrı ayrı işlenir. Cooldown=3s rampa geçiş süresinden
      kısa olduğu için her STOP doğru tetiklenir. anti_rollback aktif.

  - isim: ATIS_BOLGESI
    yolo_sinifi: Tabela_9
    waypoint:
      x: 0.0
      y: 0.0
      yaw: 0.0
    pas_gecilir: false
    pas_puan: 50        # §9 atış (iç daire); §9 pas örneği doğrudan bu aşamayı -50 diye verir
    aciklama: "Atış bölgesi — araç durur, nişan alır, lazer ateşlenir (max 3 deneme)"


  - isim: HIZLANMA_PARKURU
    yolo_sinifi: Tabela_11
    waypoint:
      x: 0.0    # ⚠️ PLACEHOLDER — SLAM haritasından doldur (pistin başlangıç noktası)
      y: 0.0
      yaw: 0.0  # aracın ilerleme yönüne hizala
    pas_gecilir: false
    pas_puan: 25        # §9 hızlanma — PAS GEÇİLEMEZ
    aciklama: >
      §6.11 Hızlanma parkuru girişi. Nav2 bu noktaya götürür, sonra
      HizlanmaState devralır: Nav2 bypass, doğrudan /cmd_vel 3.0 m/s,
      30m enkoder mesafesi, son 5m rampalı fren, Tabela_11_son yedek dur.

# Genel parametreler
parametreler:
  ardisik_frame_sayisi: 3         # terrain_adapter.py → kaç ardışık frame'de tabela geçerli sayılır
  hedef_tolerans_metre: 0.30      # nav2_params.yaml xy_goal_tolerance ile eşleştirildi [m]
  hedef_tolerans_yaw: 0.20        # nav2_params.yaml yaw_goal_tolerance ile eşleştirildi [rad]
  asama_timeout_saniye: 120.0     # misyon_fsm.py → Nav2 bu sürede hedefe varamazsa goal iptal [s]
  baslangic_bekleme: 3.0          # Otonom moda geçişte bekleme süresi [s]
  kosu_suresi_saniye: 900.0       # §6.12 — atış dahil tüm koşu 15 dakika [s]
  # Aşama timeout'u × aşama sayısı (120 × 11 = 1320 s) koşu limitinden uzun.
  # Bu bir hata değil: aşama süreleri misyon_fsm'de koşu saatiyle kırpılıyor,
  # 120 s tek bir aşamanın üst sınırı, toplam bütçe değil. asama_timeout'u
  # yükseltirken bunun toplam süreyi artırmadığı, yalnız tek bir takılan
  # aşamanın koşunun daha büyük bir kısmını yiyebileceği anlamına geldiği
  # unutulmamalı.
