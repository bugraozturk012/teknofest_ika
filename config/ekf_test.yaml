### ekf_test.yaml — Test Aracı EKF Konfigürasyonu
# Lydia'nın ekf.yaml'ından FARKLARI:
#   - IMU devre dışı: breadboard IMU gürültülü, SLAM'ı bozuyor
#   - two_d_mode: true (diferansiyel test aracı, düz zemin)
#   - Sadece odometry kullanılır

ekf_filter_node:
  ros__parameters:

    frequency: 50.0
    sensor_timeout: 0.1
    transform_time_offset: 0.0
    transform_timeout: 0.05

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom

    two_d_mode: true   # Diferansiyel test aracı, düz zemin

    print_diagnostics: true
    debug: false

    # ── Kaynak 0: Dead reckoning odometrisi (test_arac_koprusu) ─────────
    odom0: /odom
    #                    x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw
    odom0_config:     [true,  true,  false,  false, false, true,  true,  false, false, false, false, true,
                       false, false, false]
    odom0_queue_size:    10
    odom0_nodelay:       false
    odom0_differential:  false
    odom0_relative:      false

    # ── IMU devre dışı — breadboard IMU gürültüsü SLAM'ı bozuyor ────────
    imu0: /imu/data
    #                    x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw
    imu0_config:      [false, false, false,  false, false, false,  false, false, false, false, false, false,
                       false, false, false]
    imu0_queue_size:     10
    imu0_nodelay:        false
    imu0_differential:   true
    imu0_relative:       false
    imu0_remove_gravitational_acceleration: true

