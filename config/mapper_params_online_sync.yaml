slam_toolbox:
  ros__parameters:

    # ── Eklenti ve mod ─────────────────────────────────────────────────────────
    solver_plugin:              solver_plugins::CeresSolver
    ceres_linear_solver:        SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner:       SCHUR_JACOBI
    ceres_trust_strategy:       LEVENBERG_MARQUARDT
    ceres_dogleg_type:          TRADITIONAL_DOGLEG
    ceres_loss_function:        None

    # ── Frame tanımları ────────────────────────────────────────────────────────
    odom_frame:                 odom
    map_frame:                  map
    base_frame:                 base_footprint
    # preprocessing_node çıkışı. Ham /scan aracın arkasındaki ±45°'yi de
    # taşıyor ve orayı gövde kapatıyor: dönüşler araç çerçevesinde SABİT açı ve
    # SABİT mesafede duruyor, yani eşleştiriciye hiç kımıldamayan bir desen
    # veriyor. O desen hem her kareyi "hareket yok" yönüne çekiyor hem haritaya
    # aracı takip eden bir leke olarak işleniyor. Menzil eşiği bunu elemiyor
    # (gövde minimum_laser_range'in çok üstünde), eleyen tek şey filtrenin açı
    # kırpması. Nav2 costmap'i de aynı konuyu okuyor — ikisinin farklı tarama
    # görmesi kendi başına bir arıza sınıfı.
    #
    # Sahada ham taramaya dönmek gerekirse yaml düzenlemeye gerek yok:
    # lydia_startup.sh SLAM_SCAN_TOPIC ile bu satırı çalışma anında eziyor.
    scan_topic:                 /scan/filtered
    mode:                       mapping

    # ── Harita çözünürlüğü ────────────────────────────────────────────────────
    resolution:                 0.05        # [m/pixel] — 5 cm
    minimum_laser_range:        0.1         # [m] — YDLidar Tmini Pro min menzil
    max_laser_range:            8.0         # [m] — YDLidar Tmini Pro gerçek max menzil
    # Sıfır "her taramayı poz grafiğine düğüm olarak ekle" demek ve duran
    # araçta haritalama için yazılmıştı. Koşuda açık kalırsa 10 Hz tarama
    # 15 dakikada dokuz bin düğüm eder; döngü kapama araması her seferinde o
    # grafiği geziyor ve bu, YOLO ile aynı Jetson'da ölçülebilir bir yük.
    # 0,3 m ≈ 0,65 m/s'de yarım saniyede bir düğüm.
    minimum_travel_distance:    0.3         # [m]
    minimum_travel_heading:     0.3         # [rad]

    # ── Tarama eşleştirme ─────────────────────────────────────────────────────
    use_scan_matching:          true
    use_scan_barycenter:        true
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing:            true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine:   0.45

    # ── Korelasyon arama ──────────────────────────────────────────────────────
    correlation_search_space_dimension:     0.5
    correlation_search_space_resolution:    0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension:            8.0
    loop_search_space_resolution:           0.05
    loop_search_space_smear_deviation:      0.03

    # ── Mesaj filtresi ────────────────────────────────────────────────────────
    message_filter_queue_size:  50
    transform_timeout:          0.5         # [s]
    tf_buffer_duration:         30.0        # [s]

    # ── Harita kaydetme ───────────────────────────────────────────────────────
    map_update_interval:        5.0         # [s]
    enable_interactive_mode:    false
