### nav2_params.yaml — LYDİA Nav2 Konfigürasyonu
#
# Araç: Ackermann kinematikli İKA
#   Dingil arası       : 0.55 m
#   İz genişliği       : 0.67 m
#   Max hız            : 3.0 m/s  (VESC sınırı)
#   Max direksiyon açısı: 30°
#   Min dönüş yarıçapı : L / tan(delta_max) = 0.55 / tan(30°) ≈ 0.95 m
#
# Planner  : SmacPlannerHybrid (Reeds-Shepp — Ackermann uyumlu)
# Controller: RegulatedPurePursuitController (RPP — Ackermann uyumlu)
#
# KURULUM:
#   sudo apt install ros-humble-nav2-bringup ros-humble-nav2-smac-planner
#
# ÇALIŞTIRMA:
#   ros2 launch nav2_bringup navigation_launch.py \
#        params_file:=config/nav2_params.yaml use_sim_time:=false
#
# TUNING NOTU:
#   H3 haftasında gerçek araçta DWA/RPP parametreleri deneysel ayarlanacak.
#   Buradaki değerler başlangıç noktası — güvenli ve muhafazakâr seçildi.

# ─────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered    # EKF çıkışı
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

# ─── Kontrolcü (Yerel Planlayıcı) ────────────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0     # Hz — RPP güncelleme frekansı
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25       # [m] — Hedefe varış toleransı
      yaw_goal_tolerance: 0.15      # [rad] ≈ 8.6°

    # ── Regulated Pure Pursuit Controller ────────────────────────────────
    # Ackermann araçlar için uygun: lookahead ile eğrilik sınırlaması
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Hız parametreleri
      desired_linear_vel: 0.8           # Nominal hız [m/s] — araçta artırılacak
      lookahead_dist: 1.5               # [m] — lookahead başlangıç mesafesi
      min_lookahead_dist: 0.8           # [m] — minimum lookahead
      max_lookahead_dist: 3.0           # [m] — maksimum lookahead
      lookahead_time: 1.5               # [s] — hızla ölçeklenen lookahead

      use_rotate_to_heading: false          # Ackermann yerinde dönemez — kapalı
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.2

      # Hız düzenleme
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0

      # Eğrilik bazlı hız sınırlama
      # Ackermann aracın maksimum dönüş yarıçapı: ~0.95 m
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0   # [m] — bu yarıçapın altında yavaşla
      regulated_linear_scaling_min_speed: 0.25   # [m/s] — minimum hız

      # Engel durma — taşlı yolda sert dur yerine yavaşla
      use_collision_detection: false
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

      # Ackermann kısıtı
      # max angular = v * tan(delta_max) / L = 3.0 * tan(30°) / 0.55 ≈ 3.14 rad/s
      # Güvenlik için 1.0 rad/s ile başla, araçta artır
      max_angular_vel: 1.0             # [rad/s]
      max_robot_pose_search_dist: 10.0

      use_interpolation: false

# ─── Global Planlayıcı ───────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]

    # ── SmacPlannerHybrid — Ackermann kinematik kısıtları destekler ──────
    # Reeds-Shepp eğrisi: hem ileri hem geri manevra
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"          # Sadece ileri — geri manevra yok
      angle_quantization_bins: 72              # 5° çözünürlük
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.95   # L / tan(delta_max) = 0.55/tan(30°) [m]
      reverse_penalty: 5.0           # Geri gitmeyi caydır (tercihe göre azalt)
      change_penalty: 0.1
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_reverse_expansion: false   # Geri manevra yoksa false

# ─── Smoother ────────────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ─── Behavior Server ─────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ─── Global Costmap ───────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.40

      resolution: 0.05            # [m/piksel] — 5 cm çözünürlük
      rolling_window: true
      width: 60                   # [m] — tüm parkur sığacak kadar geniş
      height: 60                  # [m]
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan cone_cloud moving_obs_cloud os30a_cloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.50
        cone_cloud:
          topic: /cone_cloud
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
        moving_obs_cloud:
          topic: /moving_obs_cloud
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          observation_persistence: 0.5
        os30a_cloud:
          topic: /apc/points/data_raw
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.1
          obstacle_max_range: 5.0
          obstacle_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45

      always_send_full_costmap: true

# ─── Lokal Costmap ────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.40          # global_costmap ile tutarlı
      rolling_window: true
      width: 8                    # [m] — lokal harita genişliği
      height: 8                   # [m] — lokal harita yüksekliği
      resolution: 0.05

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan cone_cloud moving_obs_cloud os30a_cloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.50
        cone_cloud:
          topic: /cone_cloud
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
        moving_obs_cloud:
          topic: /moving_obs_cloud
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          observation_persistence: 0.5
        os30a_cloud:
          topic: /apc/points/data_raw
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45

      always_send_full_costmap: true

# ─── AMCL (Lokalizasyon) — SLAM_Toolbox aktifse kullanılmaz ──────────────────
# Kaydedilmiş haritayla çalışırken AMCL aktif edilebilir
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    map_topic: /map

# ─── Map Server ───────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # Launch dosyasında parametre olarak verilmeli

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ─── Lifecycle Manager ────────────────────────────────────────────────────────
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl