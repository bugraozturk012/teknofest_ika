### nav2_params.yaml — LYDİA Nav2 Konfigürasyonu
#
# Araç: Ackermann kinematikli İKA
#   Dingil arası       : 1.40 m   (2026-07-27 araçtan ölçüldü)
#   İz genişliği       : 0.90 m   (arka aks, EK-7 B)
#   Max hız            : 3.0 m/s  (VESC sınırı)
#   Max direksiyon açısı: 30°
#   Min dönüş yarıçapı : L / tan(delta_max) = 1.40 / tan(30°) ≈ 2.42 m
#
# Planner  : SmacPlannerHybrid (DUBIN — sadece ileri hareket, Ackermann uyumlu)
# Controller: RegulatedPurePursuitController (RPP — Ackermann uyumlu)
#
# KURULUM (Jetson'da doğrulanmadı — NAV2_AKTIF=1 öncesi kontrol et):
#   sudo apt install ros-humble-navigation2 ros-humble-nav2-bringup \
#                    ros-humble-robot-localization
#   ros-humble-navigation2 smac_planner, regulated_pure_pursuit_controller ve
#   velocity_smoother'ı da getirir; robot_localization EKF için ayrı paket.
#   Kontrol: ros2 pkg list | grep -E 'nav2_bringup|nav2_smac|robot_localization'
#
# ÇALIŞTIRMA:
#   ros2 launch nav2_bringup navigation_launch.py \
#        params_file:=config/nav2_params.yaml use_sim_time:=false
#
# TUNING NOTU:
#   H3 haftasında gerçek araçta DWA/RPP parametreleri deneysel ayarlanacak.
#   Buradaki değerler başlangıç noktası — güvenli ve muhafazakâr seçildi.

# ─────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered    # EKF çıkışı
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      # nav2_spin_action_bt_node kaldırıldı — Ackermann uyumsuz
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

# ─── Kontrolcü (Yerel Planlayıcı) ────────────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0     # Hz — RPP güncelleme frekansı
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30       # [m] — waypoints.yaml hedef_tolerans_metre ile eşleştirildi
      yaw_goal_tolerance: 0.15      # [rad] ≈ 8.6°

    # ── Regulated Pure Pursuit Controller ────────────────────────────────
    # Ackermann araçlar için uygun: lookahead ile eğrilik sınırlaması
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Hız parametreleri
      # 0.65 = sahada doğrulanmış tek otonom tavan (2026-07-28 tam tur).
      # Çalışma anında terrain_adapter arazi profiline göre üzerine yazar
      # (0.45–0.90); buradaki değer terrain_adapter düşerse geçerli olan
      # yedektir, o yüzden en güvenli profille aynı olmalı.
      desired_linear_vel: 0.65           # Nominal hız [m/s]
      lookahead_dist: 2.0               # [m] — lookahead başlangıç mesafesi
      min_lookahead_dist: 1.2           # [m] — minimum lookahead
      max_lookahead_dist: 4.0           # [m] — maksimum lookahead
      lookahead_time: 1.5               # [s] — hızla ölçeklenen lookahead

      use_rotate_to_heading: false          # Ackermann yerinde dönemez — kapalı
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.2

      # Hız düzenleme
      # KALKIŞ SÜRTÜNMESİ TABANI: araç 0.45 m/s altındaki komutlarda yerinden
      # kalkmıyor (DAC voltajı doğru yazılıyor, tekerlek dönmüyor). RPP'nin
      # hedefe yaklaşırken hızı 0.05'e indirmesi aracı hedefin hemen öncesinde
      # durduruyor; progress_checker 20 s sonra "ilerleme yok" deyip recovery
      # tetikliyor. Yaklaşma hızı tabanın üstünde tutulup tolerans içinde
      # sıfıra düşülüyor.
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.45
      approach_velocity_scaling_dist: 2.5

      # Eğrilik bazlı hız sınırlama
      # Ackermann aracın maksimum dönüş yarıçapı: ~0.95 m
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0   # [m] — bu yarıçapın altında yavaşla
      regulated_linear_scaling_min_speed: 0.45   # [m/s] — kalkış sürtünmesi tabanı

      # Engel durma — taşlı yolda sert dur yerine yavaşla
      use_collision_detection: false
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

      # Ackermann kısıtı
      # RPP'de `max_angular_vel` diye bir parametre YOK — burada tanımlanırsa
      # sessizce yok sayılır. Açısal hız tavanı iki yerde uygulanır:
      #   1) velocity_smoother.max_velocity[2]  (aşağıda, gerçek kırpma)
      #   2) ackermann_converter δ_max clamp'i  (δ = atan(L·ω/v), 30°'de doyar)
      max_angular_accel: 3.2           # [rad/s²]
      max_robot_pose_search_dist: 10.0

      use_interpolation: false

# ─── Global Planlayıcı ───────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]

    # ── SmacPlannerHybrid — Ackermann kinematik kısıtları destekler ──────
    # DUBIN eğrisi: sadece ileri hareket, Ackermann kinematik için uygun
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"          # Sadece ileri — geri manevra yok
      angle_quantization_bins: 72              # 5° çözünürlük
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 2.42   # L / tan(delta_max) = 1.40/tan(30°) [m]
      reverse_penalty: 5.0           # Geri gitmeyi caydır (tercihe göre azalt)
      change_penalty: 0.1
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_reverse_expansion: false   # Geri manevra yoksa false

# ─── Velocity Smoother — /cmd_vel'i BASAN düğüm ──────────────────────────────
# navigation_launch.py zincirinde controller_server doğrudan /cmd_vel'e yazmaz:
#   controller_server → /cmd_vel_nav → velocity_smoother → /cmd_vel
#                                                            └→ mod_yoneticisi
# Bu blok yoksa velocity_smoother varsayılanlarıyla çalışır ve
# max_velocity[0] = 0.50 m/s olduğu için arazi profillerinin 0.50 üstündeki
# hızları (normal 0.65, fast 0.90) sessizce kırpılır — terrain_adapter
# parametreyi başarıyla yazar, araç yine de hızlanmaz.
#
# scale_velocities: Ackermann'da şart. Kırpma yalnız v'ye uygulanırsa ω/v oranı
# (dolayısıyla direksiyon açısı) bozulur ve araç fazla kırar; true iken iki
# bileşen birlikte ölçeklenir, eğrilik korunur.
#
# max_accel DÜŞÜRÜLMEMELİ: araç 0.45 m/s altında yerinden kalkmıyor, yavaş
# rampa aracı bu ölü bandın içinde tutar ve kalkış hiç olmaz.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    #             [  vx,   vy,  wz ]
    # wz tavanı aracın kinematiğinden gelir: ω_max = v_max / R_min,
    # 0.90 / 2.42 = 0.37 rad/s. Daha yüksek bir tavan komut zincirinde
    # karşılığı olmayan eğrilik taşır — ackermann_converter direksiyonu
    # δ_max'ta sessizce doyurur, hız düşmediği için araç viraja tam hızda
    # girip dışarı taşar. R_min planlayıcıdaki minimum_turning_radius ile
    # aynı değerdir, biri değişirse diğeri de değişir.
    max_velocity: [0.90, 0.0, 0.37]   # vx: en hızlı arazi profili (fast)
    min_velocity: [-0.30, 0.0, -0.37] # geri: yalnız backup recovery kullanır
    max_accel:    [2.50, 0.0, 3.20]
    max_decel:    [-2.50, 0.0, -3.20]
    deadband_velocity: [0.05, 0.0, 0.05]
    velocity_timeout: 0.5             # ackermann_converter cmd_vel_timeout ile aynı
    odom_topic: /odometry/filtered
    odom_duration: 0.1

# ─── Smoother ────────────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ─── Behavior Server ─────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # spin kaldırıldı — Ackermann araç yerinde dönemez, spin recovery çağrılırsa
    # araç titreşir ve timeout'a girer. backup + drive_on_heading ile yeniden plan üretilir.
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ─── Global Costmap ───────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.50

      resolution: 0.05            # [m/piksel] — 5 cm çözünürlük
      rolling_window: true
      width: 60                   # [m] — tüm parkur sığacak kadar geniş
      height: 60                  # [m]
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Koni engeli yalnız yolo_cone_cloud üzerinden gelir
        # (cone_fusion_node, LiDAR+YOLO füzyonu). Kamera koniyi görür ama
        # mesafesini bilmez, LiDAR mesafeyi bilir ama neyin ne olduğunu
        # bilmez; ikisi eşleşmeden koni costmap'e LETHAL basılamaz.
        observation_sources: scan yolo_cone_cloud moving_obs_cloud os30a_cloud
        scan:
          topic: /scan/filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.50
        yolo_cone_cloud:
          topic: /costmap/cone_cloud
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
        moving_obs_cloud:
          topic: /moving_obs_cloud
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          observation_persistence: 0.5
        # /apc/points/data_raw `points_frame` ile yayınlanır. OS30A'nın kendi
        # launch'ı yalnız dm_base_frame → points_frame dönüşümünü basar;
        # dm_base_frame'i base_link'e bağlayan TF açılış betiğinde
        # (OS30A_TF_AKTIF) üretilir. O yayıncı yoksa bu kaynak ayrı bir TF
        # adasında kalır, costmap tek bir noktayı bile dönüştüremez ve
        # "Transform failure" ile sürekli log basar.
        # Menzil notu: OS30A fiilen 0.02–2.5 m görüyor, aşağıdaki 5–6 m
        # tavanları sensör limitinin üstünde — kırpan sensörün kendisi.
        os30a_cloud:
          topic: /apc/points/data_raw
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.1
          obstacle_max_range: 5.0
          obstacle_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45

      always_send_full_costmap: true

# ─── Lokal Costmap ────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.50          # global_costmap ile tutarlı
      rolling_window: true
      width: 8                    # [m] — lokal harita genişliği
      height: 8                   # [m] — lokal harita yüksekliği
      resolution: 0.05

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # koni_cloud çıkarıldı — bkz. global_costmap'teki açıklama (üreticisi yok).
        observation_sources: scan yolo_cone_cloud moving_obs_cloud os30a_cloud
        scan:
          topic: /scan/filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.50
        yolo_cone_cloud:
          topic: /costmap/cone_cloud
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
        moving_obs_cloud:
          topic: /moving_obs_cloud
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          observation_persistence: 0.5
        os30a_cloud:
          topic: /apc/points/data_raw
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45

      always_send_full_costmap: true

# ─── AMCL (Lokalizasyon) — SLAM_Toolbox aktifse kullanılmaz ──────────────────
# Kaydedilmiş haritayla çalışırken AMCL aktif edilebilir
amcl:
  ros__parameters:
    use_sim_time: false
    # Odometri gürültü modeli — kinematik kısıt değil, parçacıkların odometri
    # artışına göre ne kadar yayılacağını belirler. Araca özgü olan kısım budur:
    # Ackermann viraj alırken kayar, bu yüzden dönüşten gelen öteleme belirsizliği
    # (alpha4) yükseltilir; yerinde dönüş olmadığı için dönüşten gelen dönüş
    # belirsizliği (alpha1) düşürülür.
    alpha1: 0.1   # dönüşten gelen dönüş gürültüsü
    alpha2: 0.2   # ötelemeden gelen dönüş gürültüsü
    alpha3: 0.3   # ötelemeden gelen öteleme gürültüsü — Ackermann biraz kayar
    alpha4: 0.3   # dönüşten gelen öteleme gürültüsü — virajda parçacıkları yay
    alpha5: 0.1   # yalnız omni modelde kullanılır
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # nav2_amcl yalnız iki hareket modeli sınıfı yayınlar (plugins.xml):
    # DifferentialMotionModel ve OmniMotionModel. Ackermann adında bir sınıf
    # YOKTUR; yazılırsa amcl_node pluginlib'den istisna alır, on_configure
    # başarısız olur ve lifecycle yöneticisi yerelleştirme grubunu hiç
    # ayağa kaldıramaz. Araca uyarlama sınıf adıyla değil, yukarıdaki alpha
    # katsayılarıyla yapılır.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    map_topic: /map

# ─── Map Server ───────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # Launch dosyasında parametre olarak verilmeli

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ─── Lifecycle Manager ────────────────────────────────────────────────────────
# Düğüm adı navigation_launch.py'de `lifecycle_manager_navigation`; anahtar
# `lifecycle_manager` yazılırsa blok hiç eşleşmez ve tamamen yok sayılır.
#
# autostart ve node_names'i navigation_launch.py açık parametre override'ı
# olarak geçirir — override params dosyasını yener, yani aşağıdaki liste
# BELGE niteliğindedir, yönetilen düğümleri buradan değiştiremezsin.
# Launch'ın yönettiği gerçek liste waypoint_follower'ı da içerir.
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

# lifecycle_manager_localization kaldırıldı — SLAM_Toolbox kullanılıyor, AMCL aktif değil.